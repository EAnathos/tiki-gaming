name: CI

on:
  pull_request:
    branches: [dev, main]
    # ready_for_review : une PR brouillon ne lance que le palier 1 ; la passer en « prête » lance tout.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [dev, main]
  # Palier « nuit » : run complet (toutes les zones, mutation complète) sur la branche par défaut, et à la demande.
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Les noms des jobs sont des checks obligatoires de la règle « Protected » (dev, main) :
# renommer un job bloque toutes les PR tant que la règle n'est pas mise à jour dans les settings du dépôt.
#
# Pipeline en paliers, arrêt au premier échec (fail-fast) : un palier ne démarre que si aucun job des paliers
# précédents n'a échoué (`!contains(needs.*.result, 'failure')`). Chaque job liste dans `needs` tous les jobs des
# paliers d'avant, pas seulement le dernier : un job sauté parce que son amont a échoué est « skipped », pas
# « failure », et ne suffirait pas à arrêter la suite.
#   1. Statique + unitaires : Frontend (format, lint, types, Vitest + couverture, contrat Pact, build), Backend
#      (Spotless, Checkstyle, JUnit + JaCoCo, Pact provider, chaos Toxiproxy) ; Traçabilité et Security, toujours.
#   2. Intégration : Testcontainers (PostgreSQL réel, migrations, RLS).
#   3. Tests dynamiques : mutation (Stryker, Pitest), E2E (Playwright + axe), charge (k6), DAST (ZAP).
#   4. Quality gate : SonarQube, sur la couverture produite au palier 1 (artefacts, sans rejouer les tests).
#   5. Verdict : échoue si un job a échoué.
#
# Chaque job ne tourne que si sa zone a changé (job « changes »). Un job ignoré par son `if` est compté comme
# réussi par la règle ; un workflow non déclenché, lui, laisserait les checks en attente : d'où des `if` au niveau
# des jobs plutôt qu'un filtre `paths` sur le workflow. Si le filtre échoue (`continue-on-error`), « changes »
# réussit avec des sorties vides et tous les jobs tournent (`!= 'false'`). Sur une PR qui ne touche que des jeux
# (sortie `games`), Frontend et Backend ne rejouent que les tests de ces jeux (voir docs/ci.md, analyse d'impact).
jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      database: ${{ steps.filter.outputs.database }}
      quality: ${{ steps.filter.outputs.quality }}
      games: ${{ steps.scope.outputs.games }}
    steps:
      - uses: actions/checkout@v7
        continue-on-error: true
        with:
          # Sur une PR, HEAD est le commit de fusion : son premier parent est la pointe de la branche cible.
          fetch-depth: 2
      # Run de nuit ou manuel : pas de filtre, sorties vides, donc tous les jobs tournent.
      - id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        continue-on-error: true
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Modifier ce workflow relance tous les jobs.
          filters: |
            ci: &ci
              - '.github/workflows/ci.yml'
            frontend:
              - *ci
              - 'frontend/**'
              - 'shared/**'
            backend:
              - *ci
              - 'backend/**'
              # Contrat Pact écrit par le front : le backend doit le rejouer.
              - 'frontend/pacts/**'
              - 'shared/**'
            database:
              - *ci
              - 'frontend/**'
              - 'supabase/**'
              # Stockage des parties de SDV Civilisation, testé contre la vraie base (SdvCivilisationTestcontainersIT).
              - 'backend/pom.xml'
              - 'backend/src/main/java/fr/tikigaming/games/sdv_civilisation/**'
              - 'backend/src/test/java/fr/tikigaming/games/sdv_civilisation/**'
              - 'backend/src/main/java/fr/tikigaming/games/dame/**'
              - 'backend/src/test/java/fr/tikigaming/games/dame/**'
              # Archivage des parties vérifiées de Tic-Tac-Toe, testé contre la vraie base (IT Testcontainers).
              - 'backend/src/main/java/fr/tikigaming/games/tic_tac_toe/**'
              - 'backend/src/test/java/fr/tikigaming/games/tic_tac_toe/**'
              - 'quality/db-init/**'
            quality:
              - *ci
              - 'quality/**'
      # Analyse d'impact : une PR qui ne touche que le code d'un ou plusieurs jeux ne rejoue que les tests de ces jeux
      # (sortie `games`, slugs séparés par des virgules). Le moindre fichier hors des dossiers d'un jeu (socle,
      # registre, dépendances, migrations, CI…) laisse la sortie vide : tous les tests tournent. Les push sur dev et
      # main et le run de nuit rejouent toujours tout : c'est le filet de sécurité.
      - id: scope
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          games=()
          while IFS= read -r file; do
            # Sous-dossiers partagés par tous les jeux : ce sont du socle.
            if [[ $file =~ ^frontend/src/games/(adapters|domain|testing)/ ]]; then
              echo "Hors d'un jeu : $file (tous les tests tournent)"
              exit 0
            elif [[ $file =~ ^frontend/src/games/([a-z0-9-]+)/ ]] \
              || [[ $file =~ ^frontend/public/games/([a-z0-9-]+)/ ]] \
              || [[ $file =~ ^backend/src/(main|test)/java/fr/tikigaming/games/([a-z0-9_]+)/ ]] \
              || [[ $file =~ ^backend/src/test/resources/features/([a-z0-9_-]+)/ ]]; then
              games+=("${BASH_REMATCH[-1]//_/-}")
            elif [[ $file =~ ^docs/ ]]; then
              continue
            else
              echo "Hors d'un jeu : $file (tous les tests tournent)"
              exit 0
            fi
          done < <(git diff --name-only HEAD^1 HEAD)
          list=$(printf '%s\n' "${games[@]}" | sed '/^$/d' | sort -u | paste -sd, -)
          echo "Jeux touchés : ${list:-aucun}"
          echo "games=$list" >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend (format + lint + build)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.frontend != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: ./.github/actions/node-modules
      # Après node_modules, qui est mis en cache sans ses sous-caches (voir .github/actions/node-modules). Prettier et
      # ESLint comparent le contenu des fichiers (pas leur date) : un fichier modifié est toujours revérifié. Une
      # nouvelle clé par run, la plus récente est restaurée.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/node_modules/.cache
          key: lint-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ github.run_id }}
          restore-keys: lint-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-
      - run: npm run format:check
      - run: npm run lint
      # Erreur de type : arrêt avant de lancer les tests (le build refait tsc -b, incrémental donc instantané).
      - run: npm run typecheck
      # Tests + couverture : échoue sous les seuils de vite.config.ts (cœur du lobby ≥ 95 %, global sans régression).
      - if: needs.changes.outputs.games == ''
        run: npm run test:coverage
      # PR limitée à des jeux : Vitest ne rejoue que les tests qui importent (même indirectement) un fichier modifié,
      # registre et lobby compris. Couverture partielle, donc sans seuils : ils sont vérifiés au push sur dev.
      - if: needs.changes.outputs.games != ''
        run: npm run test:coverage -- --changed HEAD^1
        env:
          VITEST_PARTIAL: "1"
      # Relue par SonarQube (palier 4) au lieu de relancer les tests.
      - uses: actions/upload-artifact@v7
        with:
          name: couverture-frontend
          path: frontend/coverage/lcov.info
          retention-days: 1
      # Contrat Pact (consumer) : le contrat régénéré doit être celui commité, que le backend rejoue.
      - run: npm run test:contract
      - name: Contrat Pact à jour
        run: |
          if ! git diff --exit-code -- pacts; then
            echo "::error::Le contrat Pact a changé : lance npm run test:contract dans frontend/ et commite frontend/pacts."
            exit 1
          fi
      - run: npm run build

  backend:
    name: Backend (format + lint + tests)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.backend != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Formatage vérifié d'abord : sinon Spotless (phase verify) ne tombe qu'après tous les tests.
      - run: mvn -B spotless:check
      # verify = Checkstyle (validate) + compilation + tests + couverture JaCoCo + Spotless (check)
      - if: needs.changes.outputs.games == ''
        run: mvn -B verify
      # PR limitée à des jeux : leurs tests, plus ceux du socle qui chargent tous les jeux (OpenAPI dans config,
      # Pact provider dans contract). Couverture partielle, donc seuils JaCoCo non bloquants (vérifiés sur dev).
      - if: needs.changes.outputs.games != ''
        env:
          GAMES: ${{ needs.changes.outputs.games }}
        run: |
          tests="fr/tikigaming/config/**/*,fr/tikigaming/contract/**/*"
          for game in ${GAMES//,/ }; do tests="$tests,fr/tikigaming/games/${game//-/_}/**/*"; done
          mvn -B verify -Dtest="$tests" -Dsurefire.failIfNoSpecifiedTests=false -Djacoco.haltOnFailure=false
      # Lancé tel quel par k6 et ZAP (palier 3) au lieu de recompiler avec spring-boot:run.
      - uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: backend/target/tiki-gaming-backend-*.jar
          retention-days: 1
      # Relus par SonarQube (palier 4) : rapport JaCoCo et classes compilées (sonar.java.binaries).
      - uses: actions/upload-artifact@v7
        with:
          name: couverture-backend
          path: |
            backend/target/site/jacoco/jacoco.xml
            backend/target/classes/
            backend/target/test-classes/
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rapport-bdd-dame
          path: backend/target/cucumber/

  # Toujours exécuté et sans dépendance : un test renommé côté front ou backend casse la matrice.
  traceability:
    name: Traçabilité (RTM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Exigences ↔ cas de test ↔ anomalies (specs/rtm-matrix.md) : zéro rupture de chaîne.
      - run: node frontend/scripts/check-rtm.mjs

  integration:
    name: Integration (Testcontainers)
    needs: [changes, frontend, backend]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.event.pull_request.draft != true && needs.changes.outputs.database != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-modules
      # Le runner identifie une migration par sa version (horodatage) : deux fichiers de même version, et le second
      # serait ignoré sans bruit en prod.
      - name: Migrations (format des noms, versions uniques)
        run: npm run db:check
      # Une migration déjà sur la branche cible est (ou sera) appliquée en prod, et le runner ne rejoue jamais une
      # version connue : la modifier, la renommer ou la supprimer n'aurait aucun effet en base. Il faut en ajouter une.
      - name: Migrations déjà mergées inchangées
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          changed=$(git diff --name-status --diff-filter=DMR FETCH_HEAD HEAD -- ':/supabase/migrations')
          if [ -n "$changed" ]; then
            echo "::error::Migration déjà sur $BASE_REF modifiée, renommée ou supprimée : crée plutôt une nouvelle migration (supabase migration new <nom>)."
            echo "$changed"
            exit 1
          fi
      # Conteneur supabase/postgres éphémère, migrations rejouées sur base vide, puis RLS et catalogue.
      - run: npm run test:integration
      # Même image et mêmes migrations, avec un vrai PostgREST devant : stockage des parties de SDV Civilisation
      # (classe *IT, ignorée par `mvn test`). L'image Postgres est déjà sur le runner après l'étape précédente.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Stockage des parties SDV Civilisation (Testcontainers + PostgREST)
        working-directory: backend
        run: mvn -B test -Dtest=SdvCivilisationTestcontainersIT -Dsurefire.failIfNoSpecifiedTests=false
      - name: Persistance Java Dames (PostgreSQL et PostgREST réels)
        working-directory: backend
        run: mvn -B -Pintegration '-Dit.test=fr/tikigaming/games/dame/**/*IT' test-compile failsafe:integration-test failsafe:verify
      # Archivage des parties vérifiées de Tic-Tac-Toe : même image, mêmes migrations, vrai PostgREST (classe *IT).
      - name: Archivage Java Tic-Tac-Toe (PostgreSQL et PostgREST réels)
        working-directory: backend
        run: mvn -B -Pintegration '-Dit.test=fr/tikigaming/games/tic_tac_toe/**/*IT' test-compile failsafe:integration-test failsafe:verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rapport-integration-backend
          path: backend/target/failsafe-reports/

  # Mutation : incrémental sur les PR et les push vers dev ou main (seuls les mutants touchés par le changement sont
  # rejoués ; le push alimente le cache lu par les PR suivantes), complet au run de nuit et à la demande, qui servent
  # de filet de sécurité (un run complet de Stryker prend ~20 min). La clé contient le lockfile et la config :
  # changer de version d'outil ou de config repart d'un run complet.
  mutation-frontend:
    name: Mutation (Stryker)
    needs: [changes, frontend, backend, integration]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.event.pull_request.draft != true && needs.changes.outputs.frontend != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-modules
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/reports/stryker-incremental.json
          key: stryker-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json', 'frontend/stryker.config.mjs') }}-${{ github.head_ref || github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            stryker-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json', 'frontend/stryker.config.mjs') }}-${{ github.head_ref || github.ref_name }}-
            stryker-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json', 'frontend/stryker.config.mjs') }}-
            stryker-${{ runner.os }}-
      - if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: npm run test:mutation -- --incremental
      - if: github.event_name != 'pull_request' && github.event_name != 'push'
        run: npm run test:mutation -- --incremental --force
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rapport-mutation-frontend
          path: frontend/reports/mutation/

  mutation-backend:
    name: Mutation (Pitest)
    needs: [changes, frontend, backend, integration]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.event.pull_request.draft != true && needs.changes.outputs.backend != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PIT_HISTORY: target/pit-history/history.bin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/target/pit-history
          key: pitest-${{ runner.os }}-${{ hashFiles('backend/pom.xml') }}-${{ github.head_ref || github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            pitest-${{ runner.os }}-${{ hashFiles('backend/pom.xml') }}-${{ github.head_ref || github.ref_name }}-
            pitest-${{ runner.os }}-${{ hashFiles('backend/pom.xml') }}-
      - if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: >-
          mvn -B -Pmutation test-compile org.pitest:pitest-maven:mutationCoverage
          -DhistoryInputFile=$PIT_HISTORY -DhistoryOutputFile=$PIT_HISTORY
      - if: github.event_name != 'pull_request' && github.event_name != 'push'
        run: >-
          mvn -B -Pmutation test-compile org.pitest:pitest-maven:mutationCoverage
          -DhistoryOutputFile=$PIT_HISTORY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rapport-mutation-backend
          path: backend/target/pit-reports/

  # Toujours exécuté : une nouvelle vulnérabilité peut être publiée sans qu'aucun fichier ne change.
  security:
    name: Security (npm audit + dependency review)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Bloquant à partir d'une vulnérabilité « high » (dépendances de prod et de dev).
      - run: npm audit --audit-level=high
        working-directory: frontend
      # Sur une PR : refuse l'ajout d'une dépendance vulnérable (high+) ou sous licence incompatible.
      - if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  # Un job par moteur de rendu, en parallèle : chacun n'installe que son navigateur et ses dépendances système.
  e2e:
    name: E2E (Playwright + axe, ${{ matrix.browser }})
    needs: [changes, frontend, backend, integration]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.event.pull_request.draft != true && needs.changes.outputs.frontend != 'false' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-modules
      # Navigateurs Playwright mis en cache selon la seule version de Playwright, pas tout le lockfile : sinon chaque
      # mise à jour de dépendance les retéléchargeait (~6 min). Les dépendances système (apt) ne se mettent pas en
      # cache et sont réinstallées à chaque run.
      # La version de l'image (ImageOS : ubuntu24, ubuntu26…) fait partie de la clé : Playwright télécharge des
      # navigateurs compilés pour une version d'Ubuntu, et un WebKit d'Ubuntu 24 ne démarre pas sur Ubuntu 26
      # (libicudata.so.74 introuvable) pendant la migration d'ubuntu-latest.
      # ImageOS est une variable de la machine, lue ici par le shell (le contexte `env` des expressions ne la voit pas).
      - id: image
        run: |
          echo "os=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
          echo "playwright=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.image.outputs.os }}-${{ steps.image.outputs.playwright }}-${{ matrix.browser }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}
      # Parcours du lobby et audit WCAG 2.1 AA sous ce navigateur ; backend et Supabase simulés.
      - run: npm run test:e2e -- --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: rapport-e2e-${{ matrix.browser }}
          path: frontend/playwright-report/

  performance:
    name: Performance (k6)
    needs: [changes, frontend, backend, integration]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.event.pull_request.draft != true && (needs.changes.outputs.frontend != 'false' || needs.changes.outputs.backend != 'false' || needs.changes.outputs.database != 'false' || needs.changes.outputs.quality != 'false') }}
    runs-on: ubuntu-latest
    env:
      # Valeurs factices : aucun appel externe tant qu'aucun joueur n'est connecté (voir OpenApiDocsTest).
      GOOGLE_CLIENT_ID: ci-client-id
      GOOGLE_CLIENT_SECRET: ci-client-secret
      SUPABASE_URL: https://ci.supabase.invalid
      SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      SUPABASE_JWT_SECRET: ci-jwt-secret-with-at-least-32-characters
      # k6 envoie toutes ses parties de Rush Hour depuis une seule adresse : on mesure la capacité du serveur, pas la
      # limite par client (testée par ResultRateLimiterTest), qu'on relève donc pour ce job.
      TIKI_RUSHHOUR_MAXRESULTSPERMINUTE: 1000000
      # Idem pour la vérification des parties de Tic-Tac-Toe (testée par TicTacToeVerifyRateLimiterTest).
      TIKI_TICTACTOE_MAXVERIFICATIONSPERMINUTE: 1000000
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-modules
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Jar produit par Backend ; si Backend a été sauté (zone inchangée), le backend est compilé ici.
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: backend-jar
          path: backend-jar
      # Base éphémère (image de prod) + migrations du dépôt + 1 000 joueurs factices, puis PostgREST.
      - run: docker compose -f quality/docker-compose.yml up -d --wait db
      - run: npm run quality:seed
        working-directory: frontend
      - run: docker compose -f quality/docker-compose.yml up -d rest
      - name: Backend en arrière-plan
        run: |
          jar=$(ls backend-jar/*.jar 2>/dev/null | head -n 1)
          if [ -n "$jar" ]; then (java -jar "$jar" > backend.log 2>&1 &); else (cd backend && mvn -B -q spring-boot:run > ../backend.log 2>&1 &); fi
          for i in $(seq 1 90); do curl -sf http://localhost:8080/api/auth/session && curl -sf -o /dev/null http://localhost:54330/ && break; sleep 2; done
      # Seuils bloquants (quality/k6/lobby.js) : P95 < 300 ms par scénario, moins de 1 % d'erreurs.
      - run: mkdir -p quality/reports && HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose -f quality/docker-compose.yml run --rm k6
      # Scénario ciblé Tic-Tac-Toe : vérification serveur d'une partie (mêmes seuils SLO, quality/k6/tic-tac-toe.js).
      - run: HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose -f quality/docker-compose.yml run --rm k6 run --quiet /quality/k6/tic-tac-toe.js
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rapport-k6
          path: |
            quality/reports/k6-summary.json
            quality/reports/k6-tic-tac-toe.json

  dast:
    name: DAST (ZAP baseline)
    needs: [changes, frontend, backend, integration]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.event.pull_request.draft != true && (needs.changes.outputs.frontend != 'false' || needs.changes.outputs.backend != 'false' || needs.changes.outputs.quality != 'false') }}
    runs-on: ubuntu-latest
    env:
      GOOGLE_CLIENT_ID: ci-client-id
      GOOGLE_CLIENT_SECRET: ci-client-secret
      SUPABASE_URL: https://ci.supabase.invalid
      SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      SUPABASE_JWT_SECRET: ci-jwt-secret-with-at-least-32-characters
      VITE_SUPABASE_URL: https://ci.supabase.invalid
      VITE_SUPABASE_ANON_KEY: ci-anon-key
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-modules
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: npm run build
        working-directory: frontend
      # Jar produit par Backend ; si Backend a été sauté (zone inchangée), le backend est compilé ici.
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: backend-jar
          path: backend-jar
      - name: Front buildé (vite preview, avec les en-têtes de sécurité) et backend en arrière-plan
        run: |
          (cd frontend && npx vite preview --host 0.0.0.0 --port 4173 --strictPort > ../preview.log 2>&1 &)
          jar=$(ls backend-jar/*.jar 2>/dev/null | head -n 1)
          if [ -n "$jar" ]; then (java -jar "$jar" > backend.log 2>&1 &); else (cd backend && mvn -B -q spring-boot:run > ../backend.log 2>&1 &); fi
          for i in $(seq 1 90); do curl -sf -o /dev/null http://localhost:4173/ && curl -sf http://localhost:8080/api/auth/session && break; sleep 2; done
      # Scan passif. Échoue sur une alerte non acceptée ; les risques acceptés sont justifiés dans quality/zap/rules.tsv.
      # Trois cibles en parallèle : le front, l'API (racine) et le groupe OpenAPI du Tic-Tac-Toe
      # (/v3/api-docs/tic-tac-toe) ; le job échoue si l'un des scans échoue.
      - name: ZAP baseline
        run: |
          mkdir -p quality/reports && chmod 777 quality/reports
          pids=()
          for target in front=http://host.docker.internal:4173/ api=http://host.docker.internal:8080/ api-tic-tac-toe=http://host.docker.internal:8080/v3/api-docs/tic-tac-toe; do
            name="${target%%=*}"; url="${target#*=}"
            docker compose -f quality/docker-compose.yml run --rm zap zap-baseline.py \
              -t "$url" -c /zap/rules/rules.tsv -r "zap-${name}.html" \
              > "zap-${name}.log" 2>&1 &
            pids+=($!)
          done
          status=0
          for pid in "${pids[@]}"; do wait "$pid" || status=1; done
          cat zap-front.log zap-api.log zap-api-tic-tac-toe.log
          exit $status
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rapport-zap
          path: quality/reports/

  sonar:
    name: SonarQube Cloud
    needs:
      - changes
      - frontend
      - backend
      - integration
      - mutation-frontend
      - mutation-backend
      - e2e
      - performance
      - dast
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.event.pull_request.draft != true && (needs.changes.outputs.frontend != 'false' || needs.changes.outputs.backend != 'false') }}
    runs-on: ubuntu-latest
    # Actif dès que le secret SONAR_TOKEN est configuré (Settings → Secrets → Actions), voir quality/README.md.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0
      - uses: ./.github/actions/node-modules
        if: env.SONAR_TOKEN != ''
      - uses: actions/setup-java@v6
        if: env.SONAR_TOKEN != ''
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Couverture produite au palier 1 (Frontend, Backend) plutôt que de rejouer les tests. Un job sauté pour sa zone
      # n'a pas d'artefact : la couverture de cette zone est alors recalculée ici, pour une analyse complète.
      - uses: actions/download-artifact@v7
        if: env.SONAR_TOKEN != ''
        continue-on-error: true
        with:
          name: couverture-frontend
          path: frontend/coverage
      - uses: actions/download-artifact@v7
        if: env.SONAR_TOKEN != ''
        continue-on-error: true
        with:
          name: couverture-backend
          path: backend/target
      - name: Couverture (Vitest lcov + JaCoCo) et dépendances Java (sonar.java.libraries)
        if: env.SONAR_TOKEN != ''
        run: |
          cd frontend
          [ -f coverage/lcov.info ] || VITE_SUPABASE_URL= VITE_SUPABASE_ANON_KEY= npm run test:coverage
          cd ../backend
          if [ -f target/site/jacoco/jacoco.xml ]; then mvn -B -q dependency:resolve; else mvn -B verify; fi
      # Plugins d'analyse (Java, JS/TS…) téléchargés une fois. Clé fixe : un plugin mis à jour par SonarCloud est
      # retéléchargé à chaque run jusqu'à ce qu'on incrémente la version de la clé.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.SONAR_TOKEN != ''
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}-v1
      - uses: SonarSource/sonarqube-scan-action@v8
        if: env.SONAR_TOKEN != ''
        with:
          # Le plan SonarCloud ne donne le statut du quality gate que pour les PRs et la branche principale (main) :
          # sur un push sur dev, on analyse sans attendre le gate (sinon le scanner sort en erreur).
          args: >-
            -Dsonar.organization=eanathos
            -Dsonar.qualitygate.wait=${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
      - if: env.SONAR_TOKEN == ''
        run: 'echo "SONAR_TOKEN absent : analyse SonarQube Cloud ignorée (voir quality/README.md)."'

  # Un seul check qui résume tout le pipeline : à rendre obligatoire dans la règle « Protected » pour que « CI
  # entièrement verte » (CONTRIBUTING) soit imposé par GitHub. Un job sauté pour sa zone compte comme réussi.
  verdict:
    name: CI (verdict)
    needs:
      - changes
      - frontend
      - backend
      - security
      - traceability
      - integration
      - mutation-frontend
      - mutation-backend
      - e2e
      - performance
      - dast
      - sonar
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::Au moins un job a échoué : le pipeline s'est arrêté à ce palier."
          exit 1
      - run: echo "Tous les paliers sont passés."
